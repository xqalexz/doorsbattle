<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOORS BATTLE — симулятор кейсов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap&subset=cyrillic">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🚪</text></svg>">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="logo">
      <span class="logo-icon">🚪</span>
      <span class="logo-text">DOORS<em>BATTLE</em></span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn lang-btn" id="langBtn" data-i18n="langBtn" data-i18n-title="langTitle" title="Switch to English">EN</button>
      <button class="icon-btn" id="soundBtn" data-i18n-title="sound" title="Звук">🔊</button>
      <button class="icon-btn" id="resetBtn" data-i18n-title="reset" title="Сбросить прогресс">↺</button>
      <div class="balance">
        <span class="balance-icon">🪙</span>
        <b id="coins">1 000</b>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn is-active" data-tab="cases" data-i18n="tabCases">Кейсы</button>
    <button class="tab-btn" data-tab="upgrades" data-i18n="tabUpgrades">Апгрейды</button>
  </nav>

  <main>

    <!-- ============ КЕЙСЫ ============ -->
    <section class="page is-active" id="page-cases">

      <div class="case-grid" id="caseGrid"></div>

      <div class="reel-wrap" id="reelWrap">
        <div class="reel-hint" id="reelHint" data-i18n="reelHint">Выберите кейс, чтобы открыть</div>
        <div class="reel" id="reel"></div>
        <div class="reel-marker"></div>
      </div>

      <div class="section-head">
        <h2 data-i18n="inventory">Инвентарь</h2>
        <button class="btn btn-ghost btn-sm" id="sellAllBtn" data-i18n="sellAll">Продать всё</button>
      </div>
      <div class="inv-grid" id="invCases"></div>

    </section>

    <!-- ============ АПГРЕЙДЫ ============ -->
    <section class="page" id="page-upgrades">

      <div class="upg-layout">

        <aside class="panel">
          <h3 data-i18n="stepItem">1. Выберите предмет</h3>
          <div class="inv-grid inv-scroll" id="invUpgrade"></div>
        </aside>

        <div class="panel upg-center">
          <div class="wheel" id="wheel">
            <canvas id="wheelCanvas"></canvas>
            <div class="needle" id="needle"><i></i></div>
            <div class="wheel-center">
              <div class="wheel-pct" id="wheelPct">—</div>
              <div class="wheel-label" id="wheelLabel">выберите предмет</div>
            </div>
          </div>

          <div class="slots">
            <div class="slot" id="slotFrom"><span class="slot-empty">Пусто</span></div>
            <div class="slot-arrow">➜</div>
            <div class="slot" id="slotTo"><span class="slot-empty">Пусто</span></div>
          </div>

          <button class="btn btn-primary btn-lg" id="spinBtn" disabled>Прокачать</button>
        </div>

        <aside class="panel">
          <h3 data-i18n="stepTarget">2. Выберите цель</h3>
          <div class="inv-grid inv-scroll" id="invTargets"></div>
        </aside>

      </div>

    </section>

  </main>
</div>

<!-- ============ МОДАЛКА ============ -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Вы получили</div>
    <div class="modal-item" id="modalItem"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalSell" data-i18n="sell">Продать</button>
      <button class="btn btn-primary" id="modalOk" data-i18n="take">Забрать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
